name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the locked dependencies without install scripts
        run: npm ci
      - name: Verify registry signatures and provenance attestations
        run: npm audit signatures
      - name: Format, lint, type-check and unit-test with coverage
        run: npm run check
      - name: Build the package twice and require identical bytes
        run: |
          first="$(npm run -s pack | tail -1)"
          rm -rf build dist
          second="$(npm run -s pack | tail -1)"
          test "${first}" = "${second}"
          unzip -tq dist/*.shell-extension.zip
          echo "Package SHA-256: \`${first}\`" >> "${GITHUB_STEP_SUMMARY}"
